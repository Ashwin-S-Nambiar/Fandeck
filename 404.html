<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f0f0ef" />
    <meta name="robots" content="noindex" />
    <title>Not found · Fandeck</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/hanken-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fragment-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/index.css" />
    <style>
      .lost {
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 22px;
        min-height: 0;
        padding: 12px 0;
        text-align: center;
        color: var(--on-page);
      }

      .book {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
        width: min(460px, 100%);
        height: clamp(120px, 26dvh, 210px);
      }

      .book span {
        display: grid;
        grid-template-rows: 1fr auto;
        border-radius: 3px;
        overflow: hidden;
        background: var(--card);
        box-shadow: var(--edge);
      }

      .book span i {
        display: block;
      }

      .book span b {
        padding: 5px 6px 6px;
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 500;
        color: var(--ink-2);
        text-align: left;
        border-top: 1px solid rgb(0 0 0 / 0.07);
      }

      .book .gone {
        background: transparent;
        box-shadow: none;
        border: 1.5px dashed var(--on-page-rule);
      }

      .book .gone b {
        border: 0;
        color: var(--on-page-2);
      }

      .lost-code {
        font-size: 13px;
        font-weight: 550;
        color: var(--on-page-2);
      }

      .lost h1 {
        font-size: clamp(26px, 5.5vw, 40px);
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.05;
        max-width: 16ch;
        text-wrap: balance;
      }

      .lost p {
        color: var(--on-page-2);
        max-width: 34ch;
      }

      .lost .btn {
        height: 44px;
        padding: 0 18px;
      }

      .lost .btn span {
        display: inline;
      }

      @media (max-height: 520px) {
        .lost {
          gap: 12px;
        }

        .book {
          display: none;
        }
      }

      @media (hover: hover) and (pointer: fine) {
        .lost .btn:hover .ic {
          transform: translateX(-2px);
        }
      }
    </style>
  </head>
  <body>
    <div class="app" style="grid-template-rows: auto minmax(0, 1fr) auto">
      <header class="top">
        <a class="mark" href="/" aria-label="Fandeck, home">
          <span class="mark-bar" aria-hidden="true"><i style="background: #d9d9d7"></i><i style="background: #b3b3b0"></i><i style="background: transparent"></i><i style="background: #6b6b69"></i><i style="background: #3d3d3c"></i></span>
          <span class="mark-name">Fandeck</span>
        </a>
      </header>
      <main class="lost">
        <div class="book" aria-hidden="true">
          <span><i style="background: #d9d9d7"></i><b>#D9D9D7</b></span>
          <span><i style="background: #b3b3b0"></i><b>#B3B3B0</b></span>
          <span class="gone"><i></i><b>404</b></span>
          <span><i style="background: #6b6b69"></i><b>#6B6B69</b></span>
          <span><i style="background: #3d3d3c"></i><b>#3D3D3C</b></span>
        </div>
        <span class="lost-code">Error 404 · Page not found</span>
        <h1>This page isn't in the swatch book.</h1>
        <p>The link might be old or mistyped. Your palette is where you left it.</p>
        <a class="btn btn-ink" href="/">
          <svg class="ic" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z" /></svg>
          <span>Back to the palette</span>
        </a>
      </main>
      <footer class="foot">
        <span>Names and harmonies from <a href="https://www.thecolorapi.com/" target="_blank" rel="noopener">The Color API</a></span>
        <span>Made by <a href="https://ashwin.co.in" target="_blank" rel="noopener">Ashwin</a></span>
      </footer>
    </div>
  </body>
</html>
